<!DOCTYPE html>
<html>
<head>
  <title>Account</title>
  <style>
  body { 
    font-family: Arial; 
    background: rgb(232,224,207); 
    color: rgb(91,46,97); 
    padding:20px; 
  }

  nav a { 
    color: rgb(91,46,97); 
    margin-right:10px; 
    text-decoration:none; 
  }

  button { 
    margin-top:5px; 
    padding:5px 10px; 
    cursor:pointer; 
    background: rgb(232,224,207); 
    color: rgb(91,46,97); 
    border: 1px solid rgb(91,46,97); 
  }

  input { 
    width:250px; 
    padding:5px; 
    margin:5px 0; 
    background: rgb(232,224,207); 
    color: rgb(91,46,97); 
    border:1px solid rgb(91,46,97); 
  }

  .tab { 
    cursor:pointer; 
    margin-right:10px; 
  }

  .active { 
    font-weight:bold; 
    text-decoration:underline; 
  }

  #status {
    margin-top:10px;
    font-weight:bold;
  }

  .success { color: green; }
  .error { color: red; }
  </style>
</head>
<body>

<nav>
<a href="index.html">Home</a>
<a href="doctrine.html">Doctrine</a>
<a href="forums.html">Forums</a>
<a href="news.html">News</a>
<a href="quiz.html">Quiz</a>
<a href="signin.html" id="accountLink">Sign In / Sign Up</a>
<button id="logoutBtn" style="display:none;">Logout</button>
</nav>

<h1 id="title">Sign In</h1>

<p>Access your account or create a new one.</p>

<div style="margin-bottom:10px;">
  <span id="signInTab" class="tab active" onclick="setMode('signin')">Sign In</span>
  <span id="signUpTab" class="tab" onclick="setMode('signup')">Sign Up</span>
</div>

<div>
  <input id="username" placeholder="Username"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="submitForm()">Continue</button>
  <br><br>
  <button onclick="googleSignIn()">Sign in with Google</button>
  <p id="passwordHint" style="font-size:12px; opacity:0.6; display:none;">
    Make sure to use a very strong password!
  </p>
</div>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZXfEl3Q68vfJtaLJqODtnQBSVEzWBmc0",
  authDomain: "probatismm.firebaseapp.com",
  projectId: "probatismm",
  storageBucket: "probatismm.firebasestorage.app",
  messagingSenderId: "746935651152",
  appId: "1:746935651152:web:82491ddac346bc654a3a55"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let mode = "signin";

function showStatus(message, type){
  const status = document.getElementById("status");
  status.innerText = message;
  status.className = type;
}

window.setMode = function(newMode){
  mode = newMode;

  document.getElementById("title").innerText =
    newMode === "signin" ? "Sign In" : "Sign Up";

  document.getElementById("signInTab").classList.toggle("active", newMode === "signin");
  document.getElementById("signUpTab").classList.toggle("active", newMode === "signup");

  const hint = document.getElementById("passwordHint");
  hint.style.display = newMode === "signup" ? "block" : "none";

  showStatus("", "");
}

async function generateUniqueUsername(baseName, isGoogle = false){

  // Clean username
  let username = baseName
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[^a-z0-9]/g, "");

  // Limit base name
  username = username.slice(0, 12);

  if(username.length < 3){
    username = "user";
  }

  // Function for Google only
  function randomString(length = 8){
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    let result = "";

    for(let i = 0; i < length; i++){
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    return result;
  }

  // =========================
  // NORMAL SIGN UP (NO RANDOM)
  // =========================
  if(!isGoogle){

    const userRef = doc(db, "usernames", username);
    const snap = await getDoc(userRef);

    if(snap.exists()){
      throw new Error("Username already taken");
    }

    return username;
  }

  // =========================
  // GOOGLE SIGN IN (WITH RANDOM)
  // =========================
  let finalUsername;
  let isUnique = false;

  while(!isUnique){

    finalUsername = username + randomString(8);

    const userRef = doc(db, "usernames", finalUsername);
    const snap = await getDoc(userRef);

    if(!snap.exists()){
      isUnique = true;
    }
  }

  return finalUsername;
}

window.submitForm = async function(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!username || !password){
    showStatus("Enter username and password", "error");
    return;
  }

  try {
    if(mode === "signup"){

      const email = username + "@example.com";

      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      const uniqueUsername = await generateUniqueUsername(username, false);

      // SAVE USER IN FIRESTORE (IMPORTANT: USE UID AS DOCUMENT ID)
      await setDoc(doc(db, "users", user.uid), {
        username: uniqueUsername,
        uid: user.uid,
        joinDate: Date.now(),
        description: "",
        profilePic: ""
      });

      // Save username lookup
      await setDoc(doc(db, "usernames", uniqueUsername), {
        uid: user.uid
      });

      // IMPORTANT: ALWAYS STORE USERNAME ONLY (NOT EMAIL)
      localStorage.setItem("currentUser", uniqueUsername);

      showStatus("Account created!", "success");

    } else {
      const email = username + "@example.com";

      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      const userDoc = await getDoc(doc(db, "users", user.uid));

      if(userDoc.exists()){
        const savedUsername = userDoc.data().username;
        localStorage.setItem("currentUser", savedUsername);
      }

      showStatus("Signed in!", "success");
    }

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);

  } catch(err){
    console.error(err);
    showStatus(err.message, "error");
  }
};

 // <-- THIS closes submitForm function properly

window.googleSignIn = async function(){
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const usersRef = doc(db, "users", user.uid);
    const existingUser = await getDoc(usersRef);

    let finalUsername;

    if (existingUser.exists()) {
      finalUsername = existingUser.data().username;
    } else {

      let baseNameRaw =
        user.displayName ||
        user.email?.split("@")[0] ||
        "user";

      baseNameRaw = baseNameRaw.replace(/\s+/g, "");

      finalUsername = await generateUniqueUsername(baseNameRaw, true);

      await setDoc(doc(db, "users", user.uid), {
        username: uniqueUsername,
        uid: user.uid,
        joinDate: Date.now(),
        usernameChangedAt: 0,
        description: "",
        profilePic: ""
      });

      // Save username lookup
      await setDoc(doc(db, "usernames", finalUsername), {
         uid: user.uid
      });
    }

    // 🔥 CRITICAL FIX: ALWAYS STORE CLEAN USERNAME
    localStorage.setItem("currentUser", finalUsername);

    showStatus("Logged in with Google!", "success");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);

  } catch(err){
    console.error(err);
    showStatus("Google sign-in failed: " + err.message, "error");
  }
};

// Code below runs on page load, outside submitForm
const accountLink = document.getElementById("accountLink");
const logoutBtn = document.getElementById("logoutBtn");

const currentUser = localStorage.getItem("currentUser");

if(currentUser){
  accountLink.innerText = "Profile";
  accountLink.href = "profile.html";
  logoutBtn.style.display = "inline";
} else {
  logoutBtn.style.display = "none";
}

logoutBtn.onclick = function() {
  localStorage.removeItem("currentUser");
  alert("Logged out");
  window.location.href = "index.html";
};
</script>


</body>
</html>
