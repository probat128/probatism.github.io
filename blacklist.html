<!DOCTYPE html>
<html>
<head>
<title>Blacklist</title>

<style>

body {
  font-family: Arial;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  padding:20px;
}

nav a {
  color: rgb(91,46,97);
  margin-right:10px;
  text-decoration:none;
}

button {
  margin-top:5px;
  padding:5px 10px;
  cursor:pointer;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  border: 1px solid rgb(91,46,97);
}

.banBox{
  border:1px solid rgb(91,46,97);
  padding:10px;
  margin-bottom:10px;
}

.time{
  font-size:12px;
  margin-top:5px;
}

</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="forums.html">Forums</a>
<a href="news.html">News</a>
<a href="profile.html">Profile</a>
</nav>

<h1>Blacklist</h1>

<div id="list">Loading...</div>

<script type="module">

import { initializeApp, getApps }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZXfEl3Q68vfJtaLJqODtnQBSVEzWBmc0",
  authDomain: "probatismm.firebaseapp.com",
  projectId: "probatismm",
  storageBucket: "probatismm.firebasestorage.app",
  messagingSenderId: "746935651152",
  appId: "1:746935651152:web:82491ddac346bc654a3a55"
};

const app = getApps().length === 0
  ? initializeApp(firebaseConfig)
  : getApps()[0];

const db = getFirestore(app);
const auth = getAuth(app);

const adminUIDs = [
  "IDlmRGgh2PaLx15krpeq5jGU6SJ3",
  "yORpmIr7jvgruQt7D8oufNi8shh2"
];

/* =========================
   ADMIN CHECK
========================= */

onAuthStateChanged(auth, (user)=>{

  if(
    !user ||
    user.isAnonymous ||
    !adminUIDs.includes(user.uid)
  ){
    window.location.href = "index.html";
    return;
  }

  loadBans();
});

/* =========================
   LOAD BANS
========================= */

async function loadBans(){

  const snap = await getDocs(collection(db,"bannedUsers"));

  const container = document.getElementById("list");

  container.innerHTML = "";

  if(snap.empty){
    container.innerHTML = "<p>No banned users.</p>";
    return;
  }

  snap.forEach(docSnap => {

    const b = docSnap.data();

    const div = document.createElement("div");

    div.className = "banBox";

    div.innerHTML = `
      <b>${b.username || "Unknown User"}</b>

      <div>
        UID: ${b.uid || docSnap.id}
      </div>

      <div class="time">
        Banned: ${
          b.bannedAt
            ? new Date(b.bannedAt).toLocaleString()
            : "Unknown"
        }
      </div>

      <button onclick="unban('${b.uid || docSnap.id}')">
        Unban
      </button>
    `;

    container.appendChild(div);
  });
}

/* =========================
   UNBAN
========================= */

window.unban = async function(uid){

  const confirmed = confirm("Unban this user?");

  if(!confirmed) return;

  try{

    await deleteDoc(doc(db,"bannedUsers",uid));

    alert("Unbanned");

    location.reload();

  } catch(err){

    console.error(err);

    alert("Failed to unban");
  }
};

</script>

</body>
</html>
