<!DOCTYPE html>
<html>
<head>
<title>Post</title>

<style>

/* =========================
   BASE UI (MATCH GENERAL.HTML)
========================= */

body {
  font-family: Arial;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  padding:20px;
  line-height:1.4;

  display:flex;
  flex-direction:column;
}

nav a {
  color: rgb(91,46,97);
  margin-right:10px;
  text-decoration:none;
}

#pageWrapper{
  display:flex;
  flex-direction:column;
  width:100%;
}

.postBox, .replyBox {
  word-break: break-word;
  overflow-wrap: break-word;
}

textarea {
  width:100%;
  height:80px;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  border:1px solid rgb(91,46,97);
  padding:5px;
}

button {
  margin-top:5px;
  padding:5px 10px;
  cursor:pointer;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  border:1px solid rgb(91,46,97);
}

.postBox {
  border:1px solid rgb(91,46,97);
  padding:10px;
  margin:10px 0;
}

.replyBox {
  border:1px solid rgb(91,46,97);
  padding:8px;
  margin:8px 0;
  display:flex;
  gap:10px;
  align-items:flex-start;
  position: relative;
}
.opBadge {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 20px;
  font-weight: bold;
  color: rgb(91,46,97);
}

/* PROFILE PIC */
.avatar {
  width:32px;
  height:32px;
  object-fit:cover;
  border:1px solid rgb(91,46,97);
  flex-shrink:0;
  cursor:pointer;
}

/* CONTENT */
.contentWrap {
  flex:1;
  min-width:0;
}

/* TIME */
.time {
  font-size:11px;
  opacity:0.7;
  margin-top:3px;
}

.readMore {
  cursor:pointer;
  font-size:12px;
  text-decoration:underline;
}

.deleteBtn {
  font-size:12px;
  padding:3px 6px;
  margin-top:5px;
}

.imgThumb {
  max-width:256px;
  max-height:256px;
  cursor:pointer;
  border:1px solid rgb(91,46,97);
  margin-top:5px;
}

.imgOverlay {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.imgOverlay img {
  max-width:90%;
  max-height:90%;
}

.modal-bg {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(232,224,207,0.8);
  justify-content:center;
  align-items:center;
  z-index:10000;
}

.modal-content {
  background:rgb(232,224,207);
  border:2px solid rgb(91,46,97);
  padding:20px;
  width:160px;
  text-align:center;
}

#reportModal .modal-content {
  width: 320px;
}

.loadMoreBtn {
  width:100%;
  margin-top:10px;
}

#replySection{
  margin-top:20px;
  padding-top:10px;
  /* REMOVED WEIRD LINE */
}

#replies{
  display:flex;
  flex-direction:column;
}

.mention {
  color: inherit;
  cursor: pointer;
  text-decoration: underline;
}

.mention:hover {
  color: blue;
}

.noReplies {
  text-align: center;
  margin-top: 10px;
  color: rgb(149,118,141);
  font-size: 14px;
}
.reportBtn {
  position:absolute;
  bottom:8px;
  right:8px;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="doctrine.html">Doctrine</a>
<a href="forums.html">Forums</a>
<a href="news.html">News</a>
<a href="quiz.html">Quiz</a>
<a href="signin.html" id="accountLink">Sign In / Sign Up</a>
<button id="logoutBtn">Logout</button>
</nav>

<h2>Post</h2>
<div id="post"></div>

<h3>Add Reply</h3>
<div id="replySection">
  <textarea id="replyText"></textarea>
  <br>
  <input type="file" id="replyImg">

  <br>

  <span id="verificationText"></span>

  <input
    type="number"
    id="verificationAnswer"
    style="
      width:70px;
      margin-left:5px;
      background:rgb(232,224,207);
      color:rgb(91,46,97);
      border:1px solid rgb(91,46,97);
    "
  >

  <br>

  <button id="sendReply">Reply</button>
  <p id="cooldownText" style="font-size:12px; margin-top:5px;"></p>
</div>

<h3 id="repliesHeading">Replies (0)</h3>

<div id="noReplies" class="noReplies">
  No replies yet
</div>

<div id="replies"></div>

<button id="loadMoreReplies" class="loadMoreBtn">
  Load More Replies
</button>

<div class="imgOverlay" id="imgOverlay">
<img id="fullImg">
</div>

<!-- DELETE MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal-content">
    <p id="modalText"></p>
    <button id="confirmBtn">Yes</button>
    <button id="cancelBtn">No</button>
  </div>
</div>

<!-- IMAGE LOCK MODAL -->
<div class="modal-bg" id="imageLockModal">
  <div class="modal-content">
    <p>
      You must be signed in to upload images.
    </p>

    <button id="imageLockOkBtn">OK</button>
  </div>
</div>


<!-- REPORT MODAL -->
<div id="reportModal" class="modal-bg">
  <div class="modal-content">
    <p>
      Are you sure you want to report this reply?<br><br>

      Submitting false reports may lead to a ban.<br><br>

      You can check what breaks the rules
      <a href="rules.html" style="color: inherit; text-decoration: underline;">
        here
      </a>.
    </p>

    <button id="confirmReportBtn">Report</button>
    <button id="cancelReportBtn">Cancel</button>
  </div>
</div>

<!-- REPORT SUCCESS MODAL -->
<div id="reportSuccessModal" class="modal-bg">
  <div class="modal-content">
    <p>Report submitted.</p>
    <button id="reportSuccessOkBtn">OK</button>
  </div>
</div>

<script type="module">

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
doc, getDoc,
collection, addDoc, getDocs,
query, where, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut,
signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

async function extractMentions(text){

  if(!text) return [];

  const matches = text.match(/@[\w]+/g) || [];

  const results = [];

  for(const match of matches){

    const username = match.replace("@","");

    if(username === "Anonymous"){
      results.push(null);
      continue;
    }

    const usernameSnap = await getDoc(
      doc(db, "usernames", username.toLowerCase())
    );

    if(usernameSnap.exists()){

      results.push({
        uid: usernameSnap.data().uid
      });

    } else {

      results.push(null);
    }
  }

  return results;
}

const firebaseConfig = {
apiKey: "AIzaSyAZXfEl3Q68vfJtaLJqODtnQBSVEzWBmc0",
authDomain: "probatismm.firebaseapp.com",
projectId: "probatismm",
storageBucket: "probatismm.firebasestorage.app",
messagingSenderId: "746935651152",
appId: "1:746935651152:web:82491ddac346bc654a3a55"
};

const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
const db = getFirestore(app);
const auth = getAuth(app);
const imageLockModal = document.getElementById("imageLockModal");
const imageLockOkBtn = document.getElementById("imageLockOkBtn");
const replyImgInput = document.getElementById("replyImg");
const reportModal = document.getElementById("reportModal");
const confirmReportBtn = document.getElementById("confirmReportBtn");
const cancelReportBtn = document.getElementById("cancelReportBtn");
const reportSuccessModal = document.getElementById("reportSuccessModal");
const reportSuccessOkBtn = document.getElementById("reportSuccessOkBtn");
const postId = new URLSearchParams(location.search).get("id");
let postAuthor = null;
let postAuthorUID = null;

/* STATE */
let currentUser=null;
let deleteTarget=null;
let pendingReport=null;
let replyList=[];
let currentUID = null;
let verificationSolution = null;

const BLACKLIST = [
  "word1",
  "word2",
  "word3"
];

let lastReportTime =
  Number(localStorage.getItem("lastReportTime")) || 0;
   

const adminUIDs = [
  "IDlmRGgh2PaLx15krpeq5jGU6SJ3",
  "yORpmIr7jvgruQt7D8oufNi8shh2"
];

function isAdmin(uid){
  return uid && adminUIDs.includes(uid);
}

function generateVerification(){

  const a = Math.floor(Math.random() * 9) + 1;
  const b = Math.floor(Math.random() * 9) + 1;
  const c = Math.floor(Math.random() * 9) + 1;

  verificationSolution = (a * b) + c;

  document.getElementById("verificationText").textContent =
    `Verification: Answer (${a} × ${b}) + ${c}`;

  document.getElementById("verificationAnswer").value = "";
}

async function checkBan(uid){
  if(!uid) return false;

  try{

    const banSnap = await getDoc(doc(db, "bannedUsers", uid));

    if(banSnap.exists()){

      const modal = document.createElement("div");

      modal.style.position = "fixed";
      modal.style.top = "0";
      modal.style.left = "0";
      modal.style.width = "100%";
      modal.style.height = "100%";
      modal.style.background = "rgba(232,224,207,0.95)";
      modal.style.display = "flex";
      modal.style.justifyContent = "center";
      modal.style.alignItems = "center";
      modal.style.zIndex = "999999";

      modal.innerHTML = `
        <div style="
          background: rgb(232,224,207);
          border:2px solid rgb(91,46,97);
          padding:20px;
          text-align:center;
        ">
          <p>You have been banned.</p>
          <button id="bannedOkBtn">OK</button>
        </div>
      `;

      document.body.appendChild(modal);

      document.getElementById("bannedOkBtn").onclick = ()=>{
        window.location.href = "index.html";
      };

      return true;
    }

    return false;

  } catch(err){
    console.error("Ban check failed:", err);
    return false;
  }
}


let replyIndex=0;
const REPLY_PAGE_SIZE = 10;

let lastReplyTime =
  Number(localStorage.getItem("lastReplyTime")) || 0;

replyImgInput.addEventListener("click", (e) => {
  if (!auth.currentUser || auth.currentUser.isAnonymous) {
    e.preventDefault();
    replyImgInput.value = "";
    imageLockModal.style.display = "flex";
  }
});

/* AUTH */
onAuthStateChanged(auth, async (user)=>{

  // no auth yet → create anonymous session
  if(!user){

    try{
      await signInAnonymously(auth);
    } catch(err){
      console.error(err);
    }

    return;
  }

  // IMPORTANT:
  // anonymous users ALSO have UIDs
  currentUID = user.uid;

  // ALWAYS CHECK BAN
  const banned = await checkBan(user.uid);

  if(banned){
    return;
  }

  // SIGNED-IN USER
  if(!user.isAnonymous){

    document.getElementById("logoutBtn").style.display = "inline";

    try {

      const userSnap = await getDoc(doc(db, "users", user.uid));

      if(userSnap.exists() && userSnap.data().username){
        currentUser = userSnap.data().username;
      } else {
        currentUser = "Anonymous";
      }

    } catch(e){

      console.error("User fetch error:", e);

      currentUser = "Anonymous";
    }

    document.getElementById("accountLink").innerText = "Profile";
    document.getElementById("accountLink").href = "profile.html";

  } else {

    // ANONYMOUS USER
    currentUser = "Anonymous";

    document.getElementById("accountLink").innerText = "Sign In / Sign Up";
    document.getElementById("accountLink").href = "signin.html";
    document.getElementById("logoutBtn").style.display = "none";
  }

});

document.getElementById("logoutBtn").onclick=async()=>{
await signOut(auth);
location.href="index.html";
};

/* PROFILE NAVIGATION */
window.goProfile = function(username){
  if(!username || username === "Anonymous") return;

  if(username === currentUser){
    window.location.href = "profile.html";
  } else {
    window.location.href = "user.html?user=" + username;
  }
};

function escapeHtml(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function renderMentions(text, mentionedUsers = []){

  if(!text) return "";

  let rendered = escapeHtml(text);

  const matches = [...text.matchAll(/@([\w]+)/g)];

  for(let i = 0; i < matches.length; i++){

    const originalUsername = matches[i][1];

    if(originalUsername === "Anonymous"){
      continue;
    }

    const mentionData = mentionedUsers[i];

    if(!mentionData?.uid){
      continue;
    }

    try{

      const userSnap = await getDoc(
        doc(db, "users", mentionData.uid)
      );

      if(!userSnap.exists()){
        continue;
      }

      const liveUsername = userSnap.data().username;

      rendered = rendered.replace(
        "@" + originalUsername,
        `<span class="mention" onclick="goProfile('${liveUsername}')">@${liveUsername}</span>`
      );

    }catch(err){
      console.error(err);
    }
  }

  return rendered;
}

/* IMAGE VIEW */
const overlay=document.getElementById("imgOverlay");
const fullImg=document.getElementById("fullImg");

window.showImg=(src)=>{
fullImg.src=src;
overlay.style.display="flex";
};

overlay.onclick=()=>overlay.style.display="none";

/* READ MORE */
function readMore(text){
if(!text) return "";
if(text.length<=400) return text;

const id=Math.random().toString(36).slice(2);

return `
<span id="t_${id}">
${text.slice(0,400)}...
<span class="readMore" onclick="
document.getElementById('full_${id}').style.display='inline';
document.getElementById('t_${id}').style.display='none';
this.style.display='none';
">read more</span>
</span>
<span id="full_${id}" style="display:none">${text}</span>
`;
}

/* LOAD USER AVATAR */
async function getAvatar(username){
  if(!username || username==="Anonymous") return null;

  const q = query(collection(db,"users"), where("username","==",username));
  const snap = await getDocs(q);

  if(snap.empty) return null;

  const data = snap.docs[0].data();
  return data.profilePic || null;
}
/* LOAD POST */
async function loadPost(){
const snap = await getDoc(doc(db, "posts", postId));

if (!snap.exists()) {
  document.getElementById("post").innerHTML =
    "<p>Post not found.</p>";
  return;
}

const p = snap.data();
postAuthor = p.author;
postAuthorUID = p.authorUID;

const avatar = await getAvatar(p.author);

document.getElementById("post").innerHTML=`
<div class="postBox">

${p.author !== "Anonymous" && avatar
  ? `<img class="avatar" src="${avatar}" onclick="goProfile('${p.author}')">`
  : ``}

<b onclick="${p.author !== "Anonymous" ? `goProfile('${p.author}')` : ''}" style="cursor:${p.author !== "Anonymous" ? "pointer" : "default"}">
${p.author}${adminUIDs.includes(p.authorUID) ? " (admin)" : ""}
</b><br>
<div id="mainPostContent"></div>

${p.image?`<br><img class="imgThumb" src="${p.image}" data-full="${p.image}" onclick="showImg(this.dataset.full)">`:``}
</div>
`;

const postHtml = await renderMentions(
  p.content,
  p.mentionedUsers || []
);

document.getElementById("mainPostContent").innerHTML =
  readMore(postHtml);

}

/* REPLIES */
async function fetchReplies(){
  const qSnap = await getDocs(
    query(collection(db,"replies"), where("postId","==",postId))
  );

  replyList = qSnap.docs.map(d => ({id:d.id,...d.data()}));
  document.getElementById("repliesHeading").textContent =
    `Replies (${replyList.length})`;

  // sort once only
  replyList.sort((a,b)=>b.time-a.time);

  // reset pagination
  replyIndex = 0;

const repliesContainer = document.getElementById("replies");
const noRepliesEl = document.getElementById("noReplies");
const loadBtn = document.getElementById("loadMoreReplies");

  // clear UI
  repliesContainer.innerHTML = "";

  if(replyList.length === 0){

    noRepliesEl.style.display = "block";
    loadBtn.style.display = "none";

    return;
  }

  noRepliesEl.style.display = "none";

  // load first batch
  await renderReplies();
}

async function renderReplies(){

  const container = document.getElementById("replies");
  const loadBtn = document.getElementById("loadMoreReplies");

  // get next batch
  const chunk = replyList.slice(replyIndex, replyIndex + REPLY_PAGE_SIZE);

  for(const r of chunk){

    const avatar = await getAvatar(r.author);

    const el=document.createElement("div");
    el.className="replyBox";

    el.innerHTML=`
    ${(postAuthorUID && r.authorUID && r.authorUID === postAuthorUID) ? `<div class="opBadge">OP</div>` : ``}

    ${r.author !== "Anonymous" && avatar
      ? `<img class="avatar" src="${avatar}" onclick="goProfile('${r.author}')">`
      : ``}

    <div class="contentWrap">
      <b onclick="${r.author !== "Anonymous" ? `goProfile('${r.author}')` : ''}" style="cursor:${r.author !== "Anonymous" ? "pointer" : "default"}">
        ${r.author}${adminUIDs.includes(r.authorUID) ? " (admin)" : ""}
      </b><br>

      <div class="reply-content"></div>

      ${r.image?`<br><img class="imgThumb" src="${r.image}" data-full="${r.image}">`:``}

      <div class="time">${new Date(r.time).toLocaleString()}</div>

      <span
        class="reportBtn"
        onclick="reportReply('${r.id}', '${r.author}', '${r.authorUID}')"
      >
        report
      </span>

      ${(
        (currentUID === r.authorUID) ||
        isAdmin(currentUID)
      ) ? `
        <button class="deleteBtn" onclick="openDelete('${r.id}')">
          Delete
        </button>
      ` : ``}


   </div>
   `;

    container.appendChild(el);

    const mentionHtml = await renderMentions(
      r.content,
      r.mentionedUsers || []
    );

    el.querySelector(".reply-content").innerHTML =
      readMore(mentionHtml);

    el.querySelectorAll(".imgThumb").forEach(img => {
      img.onclick = () => showImg(img.dataset.full);
    });

  }

  // 🔥 MOVE INDEX AFTER RENDER (IMPORTANT FIX)
  replyIndex += chunk.length;

  // show/hide button
  if(replyIndex >= replyList.length){
    loadBtn.style.display = "none";
  } else {
    loadBtn.style.display = "block";
  }

  loadBtn.onclick = () => renderReplies();
}

const loadBtn = document.getElementById("loadMoreReplies");

if(replyIndex >= replyList.length){
  loadBtn.style.display = "none";
} else {
  loadBtn.style.display = "block";
}

loadBtn.onclick = () => renderReplies();


/* DELETE MODAL */
const modal=document.getElementById("modal");
const modalText=document.getElementById("modalText");

window.openDelete = (id) => {
  deleteTarget = id;
  modalText.innerText = "Delete this reply?";
  modal.style.display = "flex";
};

document.getElementById("cancelBtn").onclick=()=>{
modal.style.display="none";
deleteTarget=null;
};

document.getElementById("confirmBtn").onclick = async () => {
  try {
    if (!deleteTarget) return;

    await deleteDoc(doc(db, "replies", deleteTarget));

    deleteTarget = null;
    modal.style.display = "none";

    fetchReplies();

  } catch (err) {
    console.error("Delete failed:", err);
    alert("Delete failed");
  }
};

/* SEND WITH COOLDOWN */
document.getElementById("sendReply").onclick=async()=>{

const now = Date.now();
const remaining = 10000 - (now - lastReplyTime);

if(remaining > 0){
  startCooldownUI(Math.ceil(remaining / 1000));
  return;
}

const btn = document.getElementById("sendReply");

const text=document.getElementById("replyText").value.trim();
const file=document.getElementById("replyImg").files[0];

const lowerText = text.toLowerCase();

const containsBlacklistedWord = BLACKLIST.some(word =>
  new RegExp(`\\b${word}\\b`, "i").test(lowerText)
);

if (containsBlacklistedWord) {
  return;
}

if(!text && !file) return;

const answer =
  document.getElementById("verificationAnswer").value.trim();

if(answer === ""){
  return;
}

if(Number(answer) !== verificationSolution){

  generateVerification();

  return;
}

btn.disabled = true;

const img=file?await new Promise(res=>{
const r=new FileReader();
r.onload=()=>res(r.result);
r.readAsDataURL(file);
}):null;

const mentions = await extractMentions(text);

if(!auth.currentUser){
  alert("Authentication still loading. Please wait a second and try again.");
  btn.disabled = false;
  return;
}

await addDoc(collection(db,"replies"),{
postId,
author: currentUser || "Anonymous",
authorUID: auth.currentUser.uid,
authorEmail: auth.currentUser.email || null,
content: text,
image: img,
time: Date.now(),

mentionedUsers: mentions
});

lastReplyTime = Date.now();

localStorage.setItem(
  "lastReplyTime",
  lastReplyTime
);

startCooldownUI(10);


document.getElementById("replyText").value="";
document.getElementById("replyImg").value="";
generateVerification();

setTimeout(()=>btn.disabled=false,10000);

fetchReplies();
};

function startCooldownUI(seconds){
  const textEl = document.getElementById("cooldownText");
  const btn = document.getElementById("sendReply");

  btn.disabled = true;

  textEl.innerText = `Wait ${seconds} seconds before replying again`;

  const interval = setInterval(() => {
    seconds--;

    if(seconds <= 0){
      clearInterval(interval);
      textEl.innerText = "";
      btn.disabled = false;
    } else {
      textEl.innerText = `Wait ${seconds} seconds before replying again`;
    }
  }, 1000);
}

if (imageLockOkBtn && imageLockModal) {
  imageLockOkBtn.onclick = () => {
    imageLockModal.style.display = "none";
  };
};

loadPost();
fetchReplies();
generateVerification();

const remainingReplyTime =
  10000 - (Date.now() - lastReplyTime);

if(remainingReplyTime > 0){
  startCooldownUI(
    Math.ceil(remainingReplyTime / 1000)
  );
}

window.reportReply = function(replyId, author, authorUID){

  if(Date.now() - lastReportTime < 300000){
    return;
  }

  pendingReport = {
    replyId,
    author,
    authorUID
  };

  reportModal.style.display = "flex";
};

confirmReportBtn.onclick = async () => {

  if(!pendingReport) return;

  try {

    await addDoc(collection(db, "reports"), {
      type: "reply",
      contentId: pendingReport.replyId,

      reporterUID: currentUID,
      reporterUsername: currentUser || "Anonymous",

      targetUID: pendingReport.authorUID,
      targetUsername: pendingReport.author,

      createdAt: Date.now()
    });

    lastReportTime = Date.now();

    localStorage.setItem(
      "lastReportTime",
      lastReportTime
    );

    pendingReport = null;

    reportModal.style.display = "none";
    reportSuccessModal.style.display = "flex";

  } catch(err){

    console.error("Report failed:", err);

    pendingReport = null;
    reportModal.style.display = "none";

    alert("Failed to submit report.");
  }
};

cancelReportBtn.onclick = () => {
  pendingReport = null;
  reportModal.style.display = "none";
};

reportSuccessOkBtn.onclick = () => {
  reportSuccessModal.style.display = "none";
};



   
</script>
