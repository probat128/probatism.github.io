async function extractMentions(text){

  if(!text) return [];

  const matches = text.match(/@[\w]+/g) || [];

  const results = [];

  for(const match of matches){

    const username = match.replace("@","");

    if(username === "Anonymous"){
      results.push(null);
      continue;
    }

    const key = username.toLowerCase();

    if(mentionLookupCache.has(key)){

      const cachedUID =
        mentionLookupCache.get(key);

      results.push(
        cachedUID
          ? { uid: cachedUID }
          : null
      );

      continue;
    }

    const usernameSnap = await getDoc(
      doc(db, "usernames", key)
    );

    if(usernameSnap.exists()){

      const uid =
        usernameSnap.data().uid;

      mentionLookupCache.set(
        key,
        uid
      );

      results.push({
        uid,
        username
      });

    }else{

      mentionLookupCache.set(
        key,
        null
      );

      results.push(null);
    }
  }

  return results;
}

function escapeHtml(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function getUsernameFromUID(uid){

  if(!uid){
    return null;
  }

  if(usernameCache.has(uid)){
    return usernameCache.get(uid);
  }

  const userSnap = await getDoc(
    doc(db, "users", uid)
  );

  let username = null;

  if(userSnap.exists()){
    username = userSnap.data().username || null;
  }

  usernameCache.set(uid, username);

  return username;
}

async function preloadMentionUsernames(items){

  const uniqueUIDs = new Set();

  for(const item of items){

    for(const mention of (item.mentionedUsers || [])){

      if(
        mention?.uid &&
        !mention?.username
      ){
        uniqueUIDs.add(mention.uid);
      }
    }
  }

  await Promise.all(
    [...uniqueUIDs].map(uid =>
      getUsernameFromUID(uid)
    )
  );
}

async function renderMentions(text, mentionedUsers = []){

  if(!text) return "";

  const escapedText = escapeHtml(text);

  const matches = [...escapedText.matchAll(/@([\w]+)/g)];

  let result = "";
  let lastIndex = 0;

  for(let i = 0; i < matches.length; i++){

    const match = matches[i];

    const originalUsername = match[1];

    const mentionData = mentionedUsers[i];

    result += escapedText.slice(
      lastIndex,
      match.index
    );

    if(
      originalUsername === "Anonymous" ||
      !mentionData?.uid
    ){
      result += match[0];
    }else{

      const liveUsername =
        mentionData.username ||
        await getUsernameFromUID(
          mentionData.uid
        );

      if(liveUsername){

        result +=
          `<span class="mention" onclick="goProfile('${liveUsername}')">@${liveUsername}</span>`;

      }else{

        result += match[0];
      }
    }

    lastIndex =
      match.index + match[0].length;
  }

  result += escapedText.slice(lastIndex);

  return result;
}

/* LOAD USER AVATAR */
async function getAvatar(username){

  if(!username || username === "Anonymous"){
    return null;
  }

  // already loaded?
  if(avatarCache.has(username)){
    return avatarCache.get(username);
  }

  const q = query(
    collection(db, "users"),
    where("username", "==", username)
  );

  const snap = await getDocs(q);

  let avatar = null;

  if(!snap.empty){
    avatar = snap.docs[0].data().profilePic || null;
  }

  avatarCache.set(username, avatar);

  return avatar;
}

  ];

  await Promise.all(
    uniqueUsers.map(username => getAvatar(username))

}

/* REPLIES */
async function fetchReplies(reset = true){

  const repliesContainer =
    document.getElementById("replies");

  const noRepliesEl =
    document.getElementById("noReplies");

  const loadBtn =
    document.getElementById("loadMoreReplies");

  if(reset){

    replyList = [];
    lastReplyDoc = null;
    hasMoreReplies = true;

    repliesContainer.innerHTML = "";
  }

  let q;

  if(lastReplyDoc){

    q = query(
      collection(db,"replies"),
      where("postId","==",postId),
      orderBy("time","desc"),
      startAfter(lastReplyDoc),
      limit(REPLY_PAGE_SIZE)
    );

  }else{

    q = query(
      collection(db,"replies"),
      where("postId","==",postId),
      orderBy("time","desc"),
      limit(REPLY_PAGE_SIZE)
    );
  }

  const qSnap = await getDocs(q);

  if(qSnap.empty){

    hasMoreReplies = false;

    if(replyList.length === 0){

      noRepliesEl.style.display = "block";
      loadBtn.style.display = "none";
    }

    return;
  }

  lastReplyDoc =
    qSnap.docs[qSnap.docs.length - 1];

  const newReplies =
    qSnap.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

  replyList.push(...newReplies);

  await preloadAvatars(newReplies);
  await preloadMentionUsernames(newReplies);

  noRepliesEl.style.display = "none";

  await renderReplies(newReplies);

  if(qSnap.docs.length < REPLY_PAGE_SIZE){
    hasMoreReplies = false;
  }

  loadBtn.style.display =
    hasMoreReplies ? "block" : "none";
}

          ">read more</span>
        </span>

        <span id="full_${id}" style="display:none">
          ${fullHtml}
        </span>
      `;
    }

    el.querySelectorAll(".imgThumb").forEach(img=>{
      img.onclick=()=>showImg(img.dataset.full);
    });
  }
}

  // 🔥 MOVE INDEX AFTER RENDER (IMPORTANT FIX)
  replyIndex += chunk.length;

  // show/hide button
  if(replyIndex >= replyList.length){
    loadBtn.style.display = "none";
  } else {
    loadBtn.style.display = "block";
  }

  loadBtn.onclick = () => fetchReplies(false);
}

function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
      img.src = e.target.result;
    };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const scale = Math.min(maxWidth / img.width, 1);

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(
        (blob) => {
          const compressedReader = new FileReader();
          compressedReader.onload = () => resolve(compressedReader.result);
          compressedReader.readAsDataURL(blob);
        },
        "image/jpeg",
        quality
      );
    };

    reader.readAsDataURL(file);
  });
}

/* SEND WITH COOLDOWN */
document.getElementById("sendReply").onclick=async()=>{

const now = Date.now();
const remaining = 10000 - (now - lastReplyTime);

if(remaining > 0){
  startCooldownUI(Math.ceil(remaining / 1000));
  return;
}

const btn = document.getElementById("sendReply");

const text=document.getElementById("replyText").value.trim();
const file=document.getElementById("replyImg").files[0];

const MAX_UPLOAD_SIZE = 1024 * 1024; // 1MB

if(file && file.size > MAX_UPLOAD_SIZE){
  alert("Image too large. Maximum allowed size is 1MB.");
  return;
}

const lowerText = text.toLowerCase();

const containsBlacklistedWord = BLACKLIST.some(word =>
  new RegExp(`\\b${word}\\b`, "i").test(lowerText)
);

if (containsBlacklistedWord) {
  return;
}

if(!text && !file) return;

const answer =
  document.getElementById("verificationAnswer").value.trim();

if(answer === ""){
  return;
}

if(Number(answer) !== verificationSolution){

  generateVerification();

  return;
}

btn.disabled = true;

const img = file ? await compressImage(file) : null;

if(img && img.length > 1300000){
  alert("Compressed image is still too large.");
  btn.disabled = false;
  return;
}

const mentions = await extractMentions(text);

if(!auth.currentUser){
  alert("Authentication still loading. Please wait a second and try again.");
  btn.disabled = false;
  return;
}

await addDoc(collection(db,"replies"),{
postId,
author: currentUser || "Anonymous",
authorUID: auth.currentUser.uid,
authorEmail: auth.currentUser.email || null,
content: text,
image: img,
time: Date.now(),

mentionedUsers: mentions
});

lastReplyTime = Date.now();

localStorage.setItem(
  "lastReplyTime",
  lastReplyTime
);

startCooldownUI(10);


document.getElementById("replyText").value="";
document.getElementById("replyImg").value="";
generateVerification();

setTimeout(()=>btn.disabled=false,10000);

fetchReplies();
};

function startCooldownUI(seconds){
  const textEl = document.getElementById("cooldownText");
  const btn = document.getElementById("sendReply");

  btn.disabled = true;

  textEl.innerText = `Wait ${seconds} seconds before replying again`;

  const interval = setInterval(() => {
    seconds--;

    if(seconds <= 0){
      clearInterval(interval);
      textEl.innerText = "";
      btn.disabled = false;
    } else {
      textEl.innerText = `Wait ${seconds} seconds before replying again`;
    }
  }, 1000);
}

  imageLockOkBtn.onclick = () => {
    imageLockModal.style.display = "none";
  };
};

loadPost();
fetchReplies();
generateVerification();

const remainingReplyTime =
  10000 - (Date.now() - lastReplyTime);

if(remainingReplyTime > 0){
  startCooldownUI(

}
