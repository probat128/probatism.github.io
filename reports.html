<!DOCTYPE html>
<html>
<head>
<title>Reports</title>

<style>
body{
  font-family: Arial;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  padding:20px;
}

nav a{
  color: rgb(91,46,97);
  margin-right:10px;
  text-decoration:none;
}

button{
  margin-top:5px;
  padding:5px 10px;
  cursor:pointer;
  background: rgb(232,224,207);
  color: rgb(91,46,97);
  border:1px solid rgb(91,46,97);
}

.reportBox{
  border:1px solid rgb(91,46,97);
  padding:10px;
  margin-bottom:15px;
}

.reportMeta{
  font-size:12px;
  margin-bottom:8px;
}

.postBox{
  border:1px solid rgb(91,46,97);
  padding:10px;
  margin-top:10px;
  display:flex;
  gap:10px;

  /* NEW */
  overflow-wrap: break-word;
  word-break: break-word;
}

.reportContent{
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
}

.readMoreBtn{
  background:none;
  border:none;
  padding:0;
  margin-top:5px;
  cursor:pointer;
  color:rgb(91,46,97);
  text-decoration:underline;
}

.avatar{
  width:40px;
  height:40px;
  object-fit:cover;
  border:1px solid rgb(91,46,97);
}

.postImg{
  max-width:256px;
  max-height:256px;
  margin-top:5px;
  border:1px solid rgb(91,46,97);
}

.buttonRow{
  margin-top:10px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.time{
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="forums.html">Forums</a>
<a href="blacklist.html">Blacklist</a>
</nav>

<h1>Reports</h1>

<label style="display:block; margin-bottom:15px;">
  <input type="checkbox" id="showDismissed">
  Show dismissed reports from the past week
</label>

<div id="reports">
Loading...
</div>

<script type="module">

import { initializeApp, getApps }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  getDoc,
  deleteDoc,
  setDoc,
  where,
  addDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAZXfEl3Q68vfJtaLJqODtnQBSVEzWBmc0",
  authDomain: "probatismm.firebaseapp.com",
  projectId: "probatismm",
  storageBucket: "probatismm.firebasestorage.app",
  messagingSenderId: "746935651152",
  appId: "1:746935651152:web:82491ddac346bc654a3a55"
};

const app =
  getApps().length === 0
    ? initializeApp(firebaseConfig)
    : getApps()[0];

const db = getFirestore(app);
const auth = getAuth(app);
const profilePicCache = {};
const showDismissedCheckbox =
  document.getElementById("showDismissed");

if(!showDismissedCheckbox){
  console.error("Missing #showDismissed checkbox");
}
/* =========================
   ADMINS
========================= */

const adminUIDs = [
  "IDlmRGgh2PaLx15krpeq5jGU6SJ3",
  "yORpmIr7jvgruQt7D8oufNi8shh2"
];

/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async (user)=>{

  if(!user || !adminUIDs.includes(user.uid)){
    window.location.href = "index.html";
    return;
  }

// no indent below
loadReports();       

showDismissedCheckbox.onchange = () => {
  loadReports();
};

});

function escapeHTML(str = ""){

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function escapeAttr(str = ""){

  return String(str)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');

}


function renderReportContent(text){

  if(!text) return "";
  text = escapeHTML(text);

  if(text.length <= 800){
    return `
      <div class="reportContent">
        ${text}
      </div>
    `;
  }

  const shortText = text.slice(0, 800);

  const id = Math.random().toString(36).slice(2);

  return `
    <div
      class="reportContent"
      id="short_${id}"
    >
      ${shortText}
    </div>

    <button
      class="readMoreBtn"
      onclick="
        document.getElementById('short_${id}').style.display='none';
        document.getElementById('full_${id}').style.display='block';
        this.remove();
      "
    >
      Read More
    </button>

    <div
      class="reportContent"
      id="full_${id}"
      style="display:none;"
    >
      ${text}
    </div>
  `;
}


/* =========================
   LOAD REPORTS
========================= */

async function loadReports(){

  const reportsDiv =
    document.getElementById("reports");

  reportsDiv.innerHTML = "Loading...";

  try{

    const showDismissed =
      showDismissedCheckbox?.checked;

    const reportsQuery = query(
      collection(db, "reports"),
      orderBy("createdAt", "asc")
    );

    const reportsSnap =
      await getDocs(reportsQuery);

    let combinedDocs = [];

/* =========================
   LOAD DISMISSED IDS
========================= */

const dismissedContentIds = new Set();

const dismissedDocsToShow = [];

if(showDismissed){

  const dismissedQuery = query(
    collection(db, "dismissedReports"),
    orderBy("dismissedAt", "desc")
  );

  const dismissedSnap =
    await getDocs(dismissedQuery);

  const weekAgo =
    Date.now() -
    (7 * 24 * 60 * 60 * 1000);

  dismissedSnap.docs.forEach(docSnap => {

    const data = docSnap.data();

    /* remember dismissed content */
    dismissedContentIds.add(data.contentId);

    /* only SHOW recent dismissed */
    if(data.dismissedAt >= weekAgo){

      dismissedDocsToShow.push({
        id: docSnap.id,
        data: () => ({
          ...data,
          dismissedHistory: true
        })
      });

    }

  });

} else {

  /* still load dismissed ids
     so active reports stay hidden */
  const dismissedSnap = await getDocs(
    collection(db, "dismissedReports")
  );

  dismissedSnap.docs.forEach(docSnap => {

    const data = docSnap.data();

    dismissedContentIds.add(data.contentId);

  });

}

/* =========================
   ACTIVE REPORTS
========================= */

reportsSnap.docs.forEach(docSnap => {

  const data = docSnap.data();

  /* hide reports already dismissed */
  if(!dismissedContentIds.has(data.contentId)){

    combinedDocs.push(docSnap);

  }

});

/* optionally show dismissed */
if(showDismissed){

  combinedDocs.push(...dismissedDocsToShow);

}

    /* optionally load dismissed */
    if(showDismissed){

      const dismissedQuery = query(
        collection(db, "dismissedReports"),
        orderBy("dismissedAt", "desc")
      );

      const dismissedSnap =
        await getDocs(dismissedQuery);

      const weekAgo =
        Date.now() -
        (7 * 24 * 60 * 60 * 1000);

      dismissedSnap.docs.forEach(docSnap => {

        const data = docSnap.data();

        if(data.dismissedAt >= weekAgo){

          combinedDocs.push({
            id: docSnap.id,
            data: () => ({
              ...data,
              dismissedHistory: true
            })
          });

        }

      });

    }

    if(combinedDocs.length === 0){
      reportsDiv.innerHTML =
        "<p>No reports.</p>";
      return;
    }

    /* build all reports in parallel */
    const htmlArray = await Promise.all(

      combinedDocs.map(async (reportDoc) => {

        const report = reportDoc.data();

        let contentData = null;

        try{

          if(report.type === "post"){

            const snap = await getDoc(
              doc(db, "posts", report.contentId)
            );

            if(snap.exists()){
              contentData = snap.data();
            }

          } else if(report.type === "reply"){

            const snap = await getDoc(
              doc(db, "replies", report.contentId)
            );

            if(snap.exists()){
              contentData = snap.data();
            }

          }

        } catch(err){

          console.error(err);

        }

        if(!contentData){
          return "";
        }

        /* profile pic cache */
        let profilePic = "";

        if(
          contentData.author &&
          contentData.author !== "Anonymous"
        ){

          if(profilePicCache[contentData.author]){

            profilePic =
              profilePicCache[contentData.author];

          } else {

            try{

              const userQuery = query(
                collection(db, "users"),
                where(
                  "username",
                  "==",
                  contentData.author
                )
              );

              const userSnap =
                await getDocs(userQuery);

              if(!userSnap.empty){

                const userData =
                  userSnap.docs[0].data();

                profilePic =
                  userData.profilePic || "";

                profilePicCache[
                  contentData.author
                ] = profilePic;

              }

            } catch(err){

              console.error(err);

            }

          }

        }

        return `
          <div class="reportBox">

            <div class="reportMeta">

              <b>
                Reported ${report.type}
                ${
                  report.dismissedHistory
                    ? "(dismissed)"
                    : ""
                }
              </b><br>

              Reporter:
              ${escapeHTML(report.reporterUsername || "")}
              ${
                report.reporterUID
                  ? `(${report.reporterUID})`
                  : "(Anonymous)"
              }

              <br>

              Target:
              ${escapeHTML(report.targetUsername || "")}
              ${
                report.targetUID
                  ? `(${report.targetUID})`
                  : "(Anonymous)"
              }

            </div>

            <div class="postBox">

              ${
                profilePic
                  ? `
                    <img
                      class="avatar"
                      src="${profilePic}"
                      loading="lazy"
                    >
                  `
                  : ""
              }

              <div>

                <b>
                  ${escapeHTML(contentData.author || "")}
                </b>

                ${renderReportContent(
                  contentData.content || ""
                )}

                ${
                  contentData.image
                    ? `
                      <img
                        class="postImg"
                        src="${escapeAttr(contentData.image)}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                      >
                    `
                    : ""
                }

                <div class="time">
                  ${new Date(
                    contentData.time
                  ).toLocaleString()}
                </div>

              </div>

            </div>

            <div class="buttonRow">

              <button
                onclick="deleteContent(
                  '${escapeAttr(report.type)}',
                  '${escapeAttr(report.contentId)}'
                )"
              >
                Delete Content
              </button>

              <button
                onclick="
                  banTargetUser(
                    '${escapeAttr(report.targetUID)}',
                    '${escapeAttr(report.targetUsername)}'
                  )
                "
              >
                Ban Target
              </button>

              <button
                onclick="
                  banUser(
                    '${escapeAttr(report.reporterUID)}',
                    '${escapeAttr(report.reporterUsername)}'
                  )
                "
              >
                Ban Reporter
              </button>

              ${
                contentData.ip && contentData.ip !== "unknown"
                  ? `<button onclick="banIP('${escapeAttr(contentData.ip)}')">IP Ban Target</button>`
                  : ""
              }

              <button
                onclick="
                  dismissReport(
                    '${escapeAttr(reportDoc.id)}'
                  )
                "
              >
                Dismiss
              </button>

            </div>

          </div>
        `;

      })

    );

    reportsDiv.innerHTML =
      htmlArray.join("");

  } catch(err){

    console.error(err);

    reportsDiv.innerHTML =
      "<p>Failed to load reports.</p>";

  }

}

/* =========================
   DELETE CONTENT
========================= */

window.deleteContent = async function(type, id){

  try{

    if(type === "post"){

      await deleteDoc(doc(db, "posts", id));

    } else if(type === "reply"){

      await deleteDoc(doc(db, "replies", id));

    }

    alert("Content deleted.");

    location.reload();

  } catch(err){

    console.error(err);

    alert("Delete failed.");

  }

};

/* =========================
   BAN USER
========================= */

window.banUser = async function(uid, username){

  if(!uid){
    alert("No UID found.");
    return;
  }

  try{

    await setDoc(doc(db, "bannedUsers", uid), {

      uid: uid,
      username: username || "Unknown",

      bannedAt: Date.now()

    });

    alert("User banned.");

  } catch(err){

    console.error(err);

    alert("Ban failed.");

  }

};

/* =========================
   DISMISS REPORT
========================= */

window.dismissReport = async function(reportId){

  try{

    const reportRef = doc(db, "reports", reportId);

    const reportSnap = await getDoc(reportRef);

    if(!reportSnap.exists()){
      alert("Report not found.");
      return;
    }

    const reportData = reportSnap.data();

    /* =========================
       FIND ALL REPORTS
       FOR SAME CONTENT
    ========================= */

    const relatedReportsQuery = query(
      collection(db, "reports"),
      where("contentId", "==", reportData.contentId)
    );

    const relatedReportsSnap =
      await getDocs(relatedReportsQuery);

    /* =========================
       MOVE ALL TO DISMISSED
    ========================= */

    for(const relatedDoc of relatedReportsSnap.docs){

      const relatedData = relatedDoc.data();

      await addDoc(
        collection(db, "dismissedReports"),
        {
          ...relatedData,
          dismissedAt: Date.now()
        }
      );

      /* delete active report */
      await deleteDoc(
        doc(db, "reports", relatedDoc.id)
      );

    }

    location.reload();

  } catch(err){

    console.error(err);

    alert("Dismiss failed.");

  }

};

window.banTargetUser = async function(uid, username){

  if(!uid){
    alert("No UID found.");
    return;
  }

  try{

    await setDoc(doc(db, "bannedUsers", uid), {
      uid: uid,

      // keep visible name
      username: username || "Anonymous",

      bannedAt: Date.now()
    });

    alert("User banned.");

  } catch(err){

    console.error(err);

    alert("Ban failed.");

  }

};

/* =========================
   BAN IP
========================= */
window.banIP = async function(ip){
  if(!ip || ip === "unknown"){
    alert("No IP found for this post.");
    return;
  }
  
  if(!confirm(`Are you sure you want to permanently IP ban: ${ip}?`)){
    return;
  }

  try {
    await setDoc(doc(db, "bannedIPs", ip), {
      ip: ip,
      bannedAt: Date.now()
    });

    alert("IP successfully banned.");
  } catch(err){
    console.error(err);
    alert("Ban failed. Check console for errors.");
  }
};

</script>

</body>
</html>
